name = "leanlrat"
defaultTargets = ["LeanLrat", "lrat-tool"]

# Read-only snapshot of agents/lean/SortProof (see tools/vendor_check.sh); built in OUR .lake only.
[[lean_lib]]
name = "SortProof"
srcDir = "vendor"
globs = ["SortProof.Machine", "SortProof.X86", "SortProof.OrderType", "SortProof.Reps", "SortProof.Relax", "SortProof.Rename", "SortProof.Snap", "SortProof.SortFacts", "SortProof.L5"]

[[lean_lib]]
name = "LeanLrat"

[[lean_exe]]
name = "lrat-tool"
root = "Main"

# Generated result files (big certificates); build one module at a time, e.g. `lake build Results.S3_I1c_K10.Main`
[[lean_lib]]
name = "Results"
globs = ["Results.+"]
